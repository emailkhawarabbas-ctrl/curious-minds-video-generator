# Sample script for script mode (about 30 seconds, 7 scenes).
#   python -m src.main render-script --script scripts/sample_24_hours_awake.yaml
#   (add --style lively or --style classic for the other looks)
#
# Only "text" is required in a scene. Everything else is picked automatically:
# the hand draws the visual line by line, the host's action comes from the text
# (question -> thinks, small number -> counts on fingers, shocking fact -> surprised,
# a process -> draws the keyword itself, extra visuals -> holds one up).
# Wrap a word in *asterisks* to make it the scene's keyword: it is handwritten on the
# board and gets one gentle camera punch-in. The last line leads back into the first,
# and loop_to_start makes the final frame flow into the opening frame.

title: "What Happens If You Don't Sleep for 24 Hours"
format: short            # short = 1080x1920, long = 1920x1080
voice_language: en
niche: human_body        # picks the host character
loop_to_start: true

scenes:
  - text: "Stay awake for *24 hours*, and your brain starts acting *drunk*."
    visual: brain.svg
    sfx: whoosh
    headline: "24 HOURS AWAKE"

  - text: "Your reactions slow down as if you were over the legal *alcohol* limit."
    visual: car.svg

  - text: "Then come *microsleeps*: blackouts of a few seconds you don't even notice."
    visual: eye.svg
    visuals: [zzz.svg]

  - text: "Your brain's alarm, the amygdala, overreacts. Small problems feel *huge*."
    visual: amygdala_alarm.svg
    pose: surprised          # any field can still be set by hand

  - text: "Hunger hormones shift, so junk food suddenly looks *amazing*."
    visual: stomach.svg
    visuals: [emotion_happy.svg]

  - text: "And new memories struggle to *stick*."
    visual: memory_photos.svg

  - text: "One good night of sleep fixes most of it. So what happens if you *skip* it?"
    visual: bed.svg
    visuals: [moon_sleepy.svg]
