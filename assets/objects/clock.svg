    <path d="M324.1 221.9 A126 126 0 0 1 137 309.1 A190 190 0 0 0 324.1 221.9 Z" fill="#D7F0FA"/>
  </g>
  <g id="part-ticks" fill="none" stroke="#2B2D42" stroke-linecap="round">
