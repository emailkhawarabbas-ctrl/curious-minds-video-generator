    <path d="M256 297 L250 286.6" stroke-width="5"/>
    <path d="M200 312 L200 292" stroke-width="8"/>
    <path d="M144 297 L150 286.6" stroke-width="5"/>
    <path d="M103 256 L113.4 250" stroke-width="5"/>
