    <path d="M284 104 C296 92 314 100 312 114 C326 112 332 128 320 136 C314 146 300 142 298 134 C284 140 272 128 280 118 C274 112 278 106 284 104 Z" fill="#8E7DFF" stroke="#2B2D42" stroke-width="5"/>
