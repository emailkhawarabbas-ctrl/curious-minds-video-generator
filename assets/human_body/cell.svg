      <path d="M90 272 L98 262 L106 282 L114 262 L122 282 L130 262 L138 282 L146 270" fill="none" stroke="#2B2D42" stroke-width="4"/>
    </g>
    <g transform="rotate(30 284 136)">
      <ellipse cx="284" cy="136" rx="36" ry="20" fill="#FF9F1C" stroke="#2B2D42" stroke-width="5"/>
      <path d="M258 136 L266 127 L274 145 L282 127 L290 145 L298 127 L306 140" fill="none" stroke="#2B2D42" stroke-width="4"/>
    </g>
  </g>
  <!-- small organelles -->
  <g id="part-organelles">
    <circle cx="258" cy="282" r="20" fill="#D7F0FA" stroke="#2B2D42" stroke-width="5"/>
    <circle cx="130" cy="108" r="13" fill="#FFD23F" stroke="#2B2D42" stroke-width="4"/>
    <path d="M276 196 C292 192 304 200 312 196 M280 212 C296 208 308 218 318 212 M286 228 C298 226 306 232 314 228" fill="none" stroke="#FF5D73" stroke-width="6"/>
    <circle cx="96" cy="200" r="5" fill="#2B2D42"/>
    <circle cx="180" cy="290" r="5" fill="#2B2D42"/>
    <circle cx="214" cy="300" r="5" fill="#2B2D42"/>
    <circle cx="238" cy="88" r="5" fill="#2B2D42"/>
    <circle cx="320" cy="248" r="5" fill="#2B2D42"/>
    <circle cx="176" cy="96" r="5" fill="#2B2D42"/>
  </g>
  <circle id="anchor-top" cx="200" cy="44" r="4"/>
  <circle id="anchor-center" cx="200" cy="194" r="4"/>
  <circle id="anchor-nucleus" cx="200" cy="184" r="4"/>
  <circle id="anchor-mitochondria" cx="120" cy="272" r="4"/>
  <circle id="anchor-membrane" cx="342" cy="150" r="4"/>
  <circle id="anchor-vacuole" cx="258" cy="282" r="4"/>
