  <ellipse cx="200" cy="364" rx="130" ry="12" fill="#2B2D42" fill-opacity="0.12"/>
  <!-- membrane + cytoplasm -->
  <g id="part-membrane">
    <path d="M200 46 C260 40 318 70 342 122 C366 174 356 236 328 282 C300 328 246 348 192 342 C134 336 84 304 62 252 C40 200 50 140 86 100 C114 68 156 50 200 46 Z" fill="#9BE7DF" stroke="#2B2D42" stroke-width="8"/>
    <path d="M346 186 C350 240 322 296 270 324 C232 344 182 346 142 330 C210 336 270 312 306 270 C330 242 342 214 346 186 Z" fill="#2EC4B6" fill-opacity="0.55"/>
    <path d="M78 150 C90 116 116 88 150 72" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="10"/>
  </g>
  <!-- endoplasmic reticulum -->
  <g id="part-er">
    <path d="M150 150 C140 170 140 196 150 214 M134 140 C118 166 118 204 134 226 M244 240 C258 230 268 214 270 198" fill="none" stroke="#5B4BC4" stroke-width="5"/>
  </g>
  <!-- nucleus -->
  <g id="part-nucleus">
