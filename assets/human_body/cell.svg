<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" data-title="Animal Cell" data-tags="cell,animal cell,nucleus,mitochondria,biology,organelles,cytoplasm,membrane,microscope,life" data-subcategory="cellular" data-style="medical_cartoon" data-animations="pop,float,draw">
