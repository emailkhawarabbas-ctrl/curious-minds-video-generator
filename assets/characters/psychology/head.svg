    <path d="M0 -266 L0 -176" fill="none" stroke="#2B2D42" stroke-width="6"/>
  </g>
  <g id="part-front">
    <path d="M-104 -222 C-90 -244 -66 -258 -40 -262" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-opacity="0.6"/>
    <path d="M40 -262 C66 -258 90 -244 104 -222" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-opacity="0.6"/>
  </g>
  <circle id="anchor-center" cx="0" cy="-120" r="4"/>
  <circle id="anchor-top" cx="0" cy="-272" r="4"/>
  <circle id="anchor-chin" cx="0" cy="-14" r="4"/>
</svg>
