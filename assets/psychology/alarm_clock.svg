    <circle cx="306" cy="62" r="7" fill="#FFD23F" stroke="#2B2D42" stroke-width="5"/>
    <path d="M96 92 C98 76 106 66 116 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="7"/>
