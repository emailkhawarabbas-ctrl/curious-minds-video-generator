    <rect x="178" y="44" width="44" height="18" rx="9" fill="#B8BCC8" stroke="#2B2D42" stroke-width="6"/>
    <path transform="translate(118 94) rotate(-36)" d="M-46 16 C-46 -20 -24 -40 0 -40 C24 -40 46 -20 46 16 Z" fill="#FFD23F" stroke="#2B2D42" stroke-width="8"/>
