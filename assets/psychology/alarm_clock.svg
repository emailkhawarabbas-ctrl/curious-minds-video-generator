<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" data-title="Alarm Clock" data-tags="alarm,clock,wake up,morning,time,alarm clock,schedule,sleep,circadian,routine">
  <ellipse cx="200" cy="364" rx="120" ry="12" fill="#2B2D42" fill-opacity="0.12"/>
  <!-- legs -->
  <g id="part-legs">
    <path d="M126 312 L104 352" fill="none" stroke="#2B2D42" stroke-width="22"/>
    <path d="M274 312 L296 352" fill="none" stroke="#2B2D42" stroke-width="22"/>
    <path d="M126 312 L104 352 M274 312 L296 352" fill="none" stroke="#3D405B" stroke-width="9"/>
  </g>
  <!-- bells + hammer -->
  <g id="part-bells">
