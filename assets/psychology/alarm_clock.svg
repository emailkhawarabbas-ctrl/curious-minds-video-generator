    <path d="M286 128 A118 118 0 0 1 116 298 A126 126 0 0 0 286 128 Z" fill="#E8435C"/>
    <path d="M100 168 C110 140 130 120 156 108" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="10"/>
