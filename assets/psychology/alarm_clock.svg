    <path d="M200 138 L200 150 M274 212 L262 212 M200 286 L200 274 M126 212 L138 212" fill="none" stroke="#2B2D42" stroke-width="7"/>
    <path d="M237 148 L234 154 M263 175 L257 178 M263 249 L257 246 M237 276 L234 270 M163 276 L166 270 M137 249 L143 246 M137 175 L143 178 M163 148 L166 154" fill="none" stroke="#2B2D42" stroke-width="4"/>
