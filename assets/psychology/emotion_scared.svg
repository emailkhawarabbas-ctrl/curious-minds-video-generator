<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" data-title="Scared Face" data-tags="scared,fear,afraid,anxiety,fright,nervous,emotion,feeling,worry,panic,stress" data-subcategory="emotions" data-style="mind_storybook" data-animations="pop,wiggle,bounce">
