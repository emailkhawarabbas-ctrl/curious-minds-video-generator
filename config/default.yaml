# Curious Minds — default configuration.
# Every value can be overridden by a user config file (--config path.yaml) or by
# environment variables named CM__SECTION__KEY (e.g. CM__TTS__VOICE=en_US-norman-medium).

brand:
  name: "CURIOUS MINDS"
  tagline: "Understand the world in a fun way."
  mascot: "auto"      # auto = per-niche host (human_body / science / psychology; science for unmatched topics), or force a character id

paths:
  assets: "assets"
  generated: "generated"
  models: "models"
  prompts: "prompts"
  content_packs: "content_packs"
  cache: "generated/.cache"

content:
  # auto = curated content pack if present, else LLM if a key is set, else offline template
  script_source: "auto"
  storyboard_source: "auto"      # auto = LLM-assisted when a key is set, else rule-based
  allow_unresearched: false      # refuse to write scripts when no research could be gathered
  block_on_review_fail: true     # a failed storytelling/visual review check (see review/) fails the video
  short_duration: [25, 90]       # seconds, allowed request range (each video is accepted within +/-20 % of its own target)
  long_duration: [360, 600]

llm:
  provider: "anthropic"
  model: "claude-opus-5-5"
  effort: "high"
  max_tokens: 32000
  server_side_fallback: true     # retry policy declines on Anthropic's recommended fallback model
  timeout_s: 600
  max_retries: 2

research:
  providers: ["wikipedia", "medlineplus", "pubmed", "tavily"]
  timeout_s: 20
  max_sources_per_provider: 4
  user_agent: "CuriousMindsResearchBot/1.0 (educational video research)"
  authoritative_domains:
    - nih.gov
    - medlineplus.gov
    - ncbi.nlm.nih.gov
    - cdc.gov
    - nhs.uk
    - apa.org
    - nasa.gov
    - sleepfoundation.org
    - who.int
    - nature.com
    - science.org

tts:
  # kokoro     = Kokoro-82M neural TTS, local & free (Apache-2.0 model + voices) — default, studio-like clarity
  # piper      = Piper VITS, local & lightweight (older, flatter delivery) — opt-in fallback
  # elevenlabs = cloud, needs ELEVENLABS_API_KEY (or TTS_API_KEY) + a voice id
  # openai     = cloud, needs OPENAI_API_KEY (or TTS_API_KEY); delivery intents become spoken instructions
  provider: "kokoro"
  fallback_provider: "none"           # "none" = fail loudly instead of silently using a weaker voice
  profile: "friendly"
  profiles:
    friendly:
      label: "US English Friendly Male"
      description: "Professional Friendly Male: warm, clear, conversational presenter"
      kokoro_voice: "am_michael"
      piper_voice: "en_US-joe-medium"
      openai_voice: "ash"
      speed: 1.0
      expressiveness: 0.6
      words_per_second: 2.85          # measured incl. directed pauses (voice preview, 2026-10-14)
    energetic:
      label: "US English Male (Energetic)"
      description: "Energetic Educational Male: brighter, quicker, more emphatic"
      kokoro_voice: "am_puck:0.6,am_michael:0.4"
      piper_voice: "en_US-john-medium"
      openai_voice: "verse"
      speed: 1.04
      expressiveness: 0.85
      words_per_second: 3.15
    documentary:
      label: "US English Male (Calm)"
      description: "Calm Documentary Male: measured, warm, authoritative"
      kokoro_voice: "am_michael:0.65,am_fenrir:0.35"
      piper_voice: "en_US-norman-medium"
      openai_voice: "onyx"
      speed: 0.93
      expressiveness: 0.45
      words_per_second: 2.7
  length_scale: 1.0                   # tempo multiplier on top of the profile speed (>1 = slower)
  noise_scale: 0.667                  # Piper only (its trained default; higher values add artefacts)
  noise_w_scale: 0.8
  sentence_pause_s: 0.22
  scene_lead_in_s: 0.30
  scene_tail_s: 0.45
  speed_fit_range: [0.92, 1.1]        # allowed tempo range when fitting narration to the target duration
  voice_base_url: "https://huggingface.co/rhasspy/piper-voices/resolve/main"
  cache: true
  asr_check: "auto"                   # Whisper intelligibility check when faster-whisper is installed

audio:
  sample_rate: 44100
  target_lufs: -14.0                  # YouTube / TikTok reference loudness
  true_peak_db: -1.5
  music_gain_db: -15.0                # music bed level (music is pre-normalised to -6 dBFS peak)
  music_duck_db: -7.0                 # additional reduction while narration plays
  sfx_gain_db: -11.0
  music_mood: "curious"

render:
  workers: 0                          # 0 = auto (cpu_count - 1, max 6)
  crf: 20
  preset: "faster"                    # x264 preset per scene segment (CRF keeps quality constant)
  audio_bitrate: "192k"
  burn_subtitles: true
  profiles:
    vertical:
      width: 1080
      height: 1920
      fps: 30
      # Platform-safe area (TikTok / Shorts UI overlays): px from each edge
      safe: {top: 230, bottom: 420, left: 70, right: 150}
      caption_zone_y: 0.695           # caption block centre as a fraction of height (above TikTok description UI)
    horizontal:
      width: 1920
      height: 1080
      fps: 30
      safe: {top: 60, bottom: 70, left: 96, right: 96}
      caption_zone_y: 0.885

thumbnail:
  width: 1280
  height: 720
